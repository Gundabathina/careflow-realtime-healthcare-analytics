# CareFlow Analytics -- Streamlit configuration.
# No secrets here: PostgreSQL credentials are read from environment
# variables only (see dashboard/database.py). This file controls
# presentation/server behavior only.

[theme]
base = "light"
primaryColor = "#0B5FA5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#1A1A2E"
font = "sans serif"

[server]
headless = true
runOnSave = false
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
# Never render a Python traceback/exception detail to end users (e.g. if
# a query raises before a page's own try/except DashboardQueryError
# block runs, such as the sidebar filter-options query). The exception
# is still logged server-side by Streamlit/the logging module -- this
# only controls what reaches the browser.
showErrorDetails = "none"
