version: 2

# Project-wide groups (referenced by +group in dbt_project.yml) and
# exposures. Model- and column-level docs/tests live alongside their
# models in staging/, intermediate/, and marts/ schema.yml files.

groups:
  - name: staging
    owner:
      name: CareFlow Data Engineering
      email: data-engineering@careflow.example
  - name: intermediate
    owner:
      name: CareFlow Data Engineering
      email: data-engineering@careflow.example
  - name: marts
    owner:
      name: CareFlow Analytics Engineering
      email: analytics-engineering@careflow.example

exposures:
